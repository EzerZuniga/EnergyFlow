<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EnergyFlow: portal académico y demostración interactiva de monitoreo y análisis del consumo energético mediante cálculo integral."
    />
    <meta name="theme-color" content="#071426" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EnergyFlow — La energía también se puede calcular</title>
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('energyflow:theme');
          const dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
